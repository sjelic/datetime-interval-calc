name: Tests and packaging
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest --cov=datetime_interval_calculator --cov-report=term-missing
      - run: python -m build
      - run: python -m venv /tmp/wheel-check
      - run: /tmp/wheel-check/bin/python -m pip install dist/*.whl pytest
      - run: cd /tmp && /tmp/wheel-check/bin/python -m pytest "$GITHUB_WORKSPACE/tests"
