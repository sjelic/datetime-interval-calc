[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datetime-interval-calculator"
version = "0.1.0"
description = "Timezone-aware interval subtraction and ticket working-time calculations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Slobodan Jelić"}]
dependencies = ["portion>=2.6,<3", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "build>=1", "ruff>=0.9"]

[project.urls]
Repository = "https://github.com/sjelic/datetime-interval-calc"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datetime_interval_calculator = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
markers = ["integration: integration and installed-package tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
